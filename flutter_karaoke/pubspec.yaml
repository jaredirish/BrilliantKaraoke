name: flutter_karaoke
description: Real-time karaoke app for Brilliant Labs Frame glasses
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Frame SDK
  frame_sdk: ^0.0.7

  # Override flutter_blue_plus to newer version
  flutter_blue_plus: ^1.32.12

  # HTTP and API
  http: ^1.1.0
  crypto: ^3.0.3

  # Environment and config
  flutter_dotenv: ^5.1.0

  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # State management
  provider: ^6.1.1

  # Audio recording (for test mode with phone microphone)
  record: ^5.0.4
  permission_handler: ^11.0.1

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Environment file (create .env file with ACRCloud credentials)
  # assets:
  #   - .env
